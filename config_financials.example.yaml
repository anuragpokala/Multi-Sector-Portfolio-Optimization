# Financials sector — EXAMPLE (copy to config_financials.yaml)

portfolio:
  name: "Financials Sector Sleeve"
  total_value: 1000000
  seed_total_assets: 5000000
  seed_max_pct: 0.08

tickers:
  - JPM
  - BAC
  - GS
  - MS
  - V

before_weights:
  JPM: 0.20
  BAC: 0.20
  GS: 0.20
  MS: 0.20
  V: 0.20

data:
  start_date: "2023-01-23"
  end_date: "2026-01-23"
  frequency: "daily"

risk_free_rate: 0.045

constraints:
  long_only: true
  fully_invested: true
  max_weight: 0.20
  min_weight: 0.0
  turnover_cap: null

mean_variance:
  lambda_min: 0.1
  lambda_max: 10.0
  lambda_points: 30
  lambda_scale: "log"
  returns_shrinkage: 0.0
  covariance_method: "ledoit_wolf"

black_litterman_macro:
  enabled: true
  use_pypfopt: true
  delta: 2.5
  tau: 0.05
  scenario:
    name: "Example rate cut"
    description: "Illustrative -50bps scenario"
    rate_change_forecast: -0.50
    confidence: 0.60
  rate_betas:
    JPM: -8.0
    BAC: -8.0
    GS: -8.0
    MS: -8.0
    V: -2.0

cvar:
  confidence_level: 0.95

output:
  directory: "outputs_financials"
  save_csv: true
  save_plots: true
  plot_format: "png"
  dpi: 300

validation:
  weight_sum_tolerance: 0.0001
  max_constraint_violation: 0.0001
  check_psd_covariance: true
